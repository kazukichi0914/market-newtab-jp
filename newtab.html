<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>マーケット</title>
  <link rel="stylesheet" href="newtab.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo" aria-hidden="true">◆</span>
      <div>
        <div class="date" id="date">--</div>
        <div class="clock" id="clock">--:--:--</div>
      </div>
    </div>

    <div class="sessions" id="sessions" aria-label="市場の開閉状況"></div>

    <form class="search" id="search" action="https://www.google.com/search" method="get" role="search" autocomplete="off">
      <input name="q" placeholder="Google で検索 / 銘柄コード・銘柄名でチャートへ" aria-label="検索">
    </form>

    <div class="controls">
      <div class="seg" id="rangeSeg" role="tablist" aria-label="チャート期間">
        <button data-range="1d" role="tab">1日</button>
        <button data-range="5d" role="tab">5日</button>
        <button data-range="1mo" role="tab">1ヶ月</button>
        <button data-range="6mo" role="tab">6ヶ月</button>
        <button data-range="1y" role="tab">1年</button>
        <button data-range="5y" role="tab">5年</button>
      </div>
      <button class="icon-btn" id="refreshBtn" title="更新（r）" aria-label="更新">⟳</button>
      <button class="icon-btn" id="settingsBtn" title="設定" aria-label="設定">⚙</button>
    </div>
  </header>

  <div class="status-line"><span id="updated" aria-live="polite">読み込み中…</span><span id="errors"></span></div>

  <main class="grid" id="grid"></main>

  <footer class="disclaimer">
    本拡張は情報提供を目的としたもので、投資勧誘や投資助言ではありません。表示されるデータは遅延・誤りを含む場合があります。投資判断はご自身の責任で行ってください。
  </footer>

  <div class="toast" id="toast" role="status" hidden></div>
  <dialog id="settings" aria-label="設定"></dialog>

  <script type="module" src="src/ui/app.js"></script>
</body>
</html>
